        <meta charset="utf-8" />

        <meta property="og:title" content="Pure Data Help Patch Builder | Charles K. Neimog" />
        <meta property="og:description" content="Build Pure Data help patches in the ELSE visual style." />
        <meta property="og:url" content="https://charlesneimog.github.io/tools/else-help/" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Pure Data Help Patch Builder | Charles K. Neimog" />

    </head>
    <body>
        <main>
            <h1>Pure Data Help Patch Builder</h1>
            <form id="patchForm">
                <fieldset>
                    <legend>General</legend>
                    <div class="field-grid two-col">
                        <label
                            >Object name
                            <input id="objectName" type="text" name="objectName" placeholder="count" required />
                        </label>
                        <label>Minimal description<input type="text" name="subtitle" placeholder="counter" /></label>
                        <label>Library name<input type="text" name="library" placeholder="ELSE" /></label>
                        <label>Library tagline<input type="text" name="libraryTagline" placeholder="library" /></label>
                    </div>
                    <label
                        >Object description<textarea
                            name="description"
                            placeholder="[object] overview text..."
                        ></textarea>
                    </label>
                </fieldset>

                <div class="section-block">
                    <header>
                        <h2>Inlets</h2>
                        <button type="button" class="secondary" data-add="inlets">+ Add inlet</button>
                    </header>
                    <div id="inletsEntries" class="entries"></div>
                </div>

                <div class="section-block">
                    <header>
                        <h2>Outlets</h2>
                        <button type="button" class="secondary" data-add="outlets">+ Add outlet</button>
                    </header>
                    <div id="outletsEntries" class="entries"></div>
                </div>

                <div class="section-block">
                    <header>
                        <h2>Flags</h2>
                        <button type="button" class="secondary" data-add="flags">+ Add flag</button>
                    </header>
                    <div id="flagsEntries" class="entries"></div>
                </div>

                <div class="section-block">
                    <header>
                        <h2>Arguments</h2>
                        <button type="button" class="secondary" data-add="arguments">+ Add argument</button>
                    </header>
                    <div id="argumentsEntries" class="entries"></div>
                </div>
                <fieldset>
                    <legend>Pixel art experiment</legend>
                    <div class="field-grid two-col">
                        <label
                            >Upload image
                            <input id="pixelArtInput" type="file" accept="image/*" />
                        </label>
                        <label
                            >Max dimension (px)
                            <input id="pixelArtSize" type="number" min="4" max="96" value="48" />
                        </label>
                    </div>
                    <p id="pixelArtStatus">No image selected.</p>
                </fieldset>
                <canvas id="pixelArtCanvas" width="1" height="1" hidden></canvas>
                <div class="actions">
                    <button type="submit">Generate patch</button>
                    <button type="button" id="downloadPatch" class="secondary" disabled>Download .pd</button>
                </div>
                <div class="output-block">
                    <label
                        >Generated patch<textarea
                            id="patchOutput"
                            readonly
                            placeholder="Patch content will appear here."
                        ></textarea>
                    </label>
                </div>
            </form>
        </main>

        <script src="/js/tools/else-help/index.js"></script>
    </body>
</html>
